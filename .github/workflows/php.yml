name: PHP Composer

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:
    name: Behat ${{ matrix.behat }} (PHP ${{ matrix.php }})

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.1'
            behat: '3.21.*'
            composer-flags: '--prefer-lowest'
          - php: '8.4'
            behat: '^3.21'
          - php: '8.5'
            behat: '^4.0'

    steps:
    - uses: actions/checkout@v3

    - uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}
        coverage: none

    - name: Validate composer.json
      run: composer validate --strict

    - name: Pin Behat
      run: composer require --no-update --no-interaction "behat/behat:${{ matrix.behat }}"

    - name: Install dependencies
      run: composer update --prefer-dist --no-progress ${{ matrix.composer-flags }}

    - name: Run test suite
      run: composer run-script test
